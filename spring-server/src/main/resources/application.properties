spring.application.name=BenchTest

# DataSource (Docker 환경변수 SPRING_DATASOURCE_* 로 덮어씌워짐)
spring.datasource.url=jdbc:mysql://localhost:3306/benchtest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Flyway가 먼저 스키마를 생성한 뒤 엔티티와 대조 검증
spring.jpa.hibernate.ddl-auto=validate

# Flyway - FlywayConfig에서 수동 관리 (자동 실행 비활성화)
spring.flyway.enabled=false
spring.flyway.clean-disabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
